<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>常暗之厢 · 卡牌 UI 预览</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f6ead7;
      --muted: #bba98f;
      --gold: #efb45f;
      --line: rgba(239, 180, 95, .28);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 18px;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 0, rgba(123, 61, 39, .22), transparent 42%),
        #080a0d;
      font-family: "Microsoft YaHei", sans-serif;
    }

    .preview { width: min(1440px, 100%); margin: 0 auto; }
    .preview-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: rgba(20, 15, 13, .9);
    }
    .preview-heading h1 { margin: 0; color: var(--gold); font-size: 18px; }
    .preview-heading p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .preview-actions { display: flex; align-items: center; gap: 8px; }
    .preview-actions label { color: var(--muted); font-size: 12px; }
    .preview-actions select,
    .preview-actions button {
      min-height: 34px;
      padding: 6px 10px;
      color: var(--ink);
      border: 1px solid rgba(239, 180, 95, .56);
      background: #2b211b;
      font: inherit;
      cursor: pointer;
    }
    .preview-actions button:hover,
    .preview-actions select:focus-visible { color: #17100a; background: var(--gold); }
    .preview-status { min-width: 130px; color: var(--muted); font-size: 12px; text-align: right; }

    #preview-stage {
      position: relative;
      width: 100%;
      height: min(74vh, 760px);
      min-height: 560px;
      overflow: hidden;
      border: 1px solid rgba(239, 180, 95, .24);
      background: #101318;
      box-shadow: 0 12px 42px rgba(0, 0, 0, .4);
    }
    .preview-help { margin: 10px 2px 0; color: rgba(246, 234, 215, .55); font-size: 12px; }

    @media (max-width: 760px) {
      body { padding: 8px; }
      .preview-toolbar { align-items: stretch; flex-direction: column; }
      .preview-actions { flex-wrap: wrap; }
      .preview-status { width: 100%; text-align: left; }
      #preview-stage { height: auto; min-height: 680px; }
    }
  </style>
</head>
<body>
  <main class="preview" aria-label="卡牌小游戏 UI 预览">
    <header class="preview-toolbar">
      <div class="preview-heading">
        <h1>卡牌小游戏 · UI 预览台</h1>
        <p>直接加载正式卡牌模块，不经过剧情、登录或存档。</p>
      </div>
      <div class="preview-actions">
        <label for="preview-mode">模式</label>
        <select id="preview-mode">
          <option value="card_battle">简单模式</option>
          <option value="card_battle_hard">困难模式</option>
        </select>
        <button id="preview-restart" type="button">重开</button>
        <span id="preview-status" class="preview-status" role="status" aria-live="polite">准备就绪</span>
      </div>
    </header>

    <section id="preview-stage" aria-label="卡牌小游戏画布"></section>
    <p class="preview-help">修改 <code>src/minigame-games/card-battle.js</code> 后刷新本页即可查看 UI；无需推进主线。</p>
  </main>

  <script src="src/namespace.js"></script>
  <script src="src/minigames.js"></script>
  <script src="src/minigame-games/card-battle.js?v=preview-card-ui-1"></script>
  <script>
    "use strict";

    const stage = document.querySelector("#preview-stage");
    const mode = document.querySelector("#preview-mode");
    const restart = document.querySelector("#preview-restart");
    const status = document.querySelector("#preview-status");
    let disposeCurrent = null;
    let runToken = 0;

    function startPreview() {
      runToken += 1;
      const token = runToken;
      disposeCurrent?.();
      const spec = window.TrainGame.Minigames.get(mode.value);
      let cleanup = null;
      stage.replaceChildren();
      status.textContent = `${spec.title} · 运行中`;

      const context = {
        stage,
        onQuit() {},
        registerCleanup(fn) { cleanup = fn; }
      };

      disposeCurrent = () => {
        cleanup?.();
        cleanup = null;
        stage.replaceChildren();
      };

      Promise.resolve(spec.run(context)).then(() => {
        if (token === runToken) status.textContent = `${spec.title} · 本局已结束`;
      }).catch((error) => {
        if (token === runToken) status.textContent = `运行失败：${error.message}`;
        console.error("卡牌预览运行失败：", error);
      });
    }

    mode.addEventListener("change", startPreview);
    restart.addEventListener("click", startPreview);
    startPreview();
  </script>
</body>
</html>
