<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>常暗之厢 · 设置</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles/main.css?v=achievement-20260921-1">
  <script src="src/compat-loader.js" data-src="src/namespace.js" data-ie-css="styles/main.ie.css|styles/ie-overrides.css"></script>
  <!-- window.TrainGame，以及 deepClone、delay 基础接口。 -->
  <script src="src/compat-loader.js" data-src="src/auth.js"></script>
  <!-- TrainGame.Auth，提供 register、login、currentUser、logout 等账号接口。 -->
  <script src="src/compat-loader.js" data-src="src/player-profile.js?v=achievement-20260921-1"></script>
  <!-- TrainGame.PlayerProfile，提供当前账号的音量偏好、结局收藏与成就。 -->
  <script src="src/compat-loader.js" data-src="src/auth-guard.js"></script>
  <!-- 调用 TrainGame.Auth.requireAuth，并注册 pageshow 登录校验；不新增主要公开接口。 -->
  <script src="src/compat-loader.js" data-src="src/page-button-sound.js?v=button04b-20260916-2"></script>
  <script src="src/compat-loader.js" data-src="src/bgm.js" data-defer="true"></script>
</head>
<body>
  <main class="site-shell content-page settings-page">
    <section class="page-panel settings-panel">
      <h1>设置</h1>
      <div class="settings-tabs" role="tablist" aria-label="设置分类">
        <button id="audio-tab" type="button" role="tab" aria-selected="true" aria-controls="audio-panel">音频</button>
        <button id="game-tab" type="button" role="tab" aria-selected="false" aria-controls="game-panel" tabindex="-1">游戏</button>
        <button id="endings-tab" type="button" role="tab" aria-selected="false" aria-controls="endings-panel" tabindex="-1">结局收集</button>
        <button id="achievements-tab" type="button" role="tab" aria-selected="false" aria-controls="achievements-panel" tabindex="-1">成就</button>
      </div>

      <section id="audio-panel" class="settings-tab-panel" role="tabpanel" aria-labelledby="audio-tab">
        <p class="page-introduction">调整后的音量会立即保存到当前账号。60% 对应游戏原本设计的音量。</p>
        <div class="volume-setting-list">
          <label class="volume-setting" for="page-music-volume">
            <span class="volume-setting-copy"><strong>页面音乐</strong><small>主页开场、主页、设置页与结束页音乐</small></span>
            <input id="page-music-volume" type="range" min="0" max="100" step="5" data-audio-setting="pageMusic" aria-describedby="page-music-value">
            <output id="page-music-value" for="page-music-volume">100%</output>
          </label>
          <label class="volume-setting" for="game-ambience-volume">
            <span class="volume-setting-copy"><strong>游戏背景音</strong><small>列车与场景中的循环环境声</small></span>
            <input id="game-ambience-volume" type="range" min="0" max="100" step="5" data-audio-setting="gameAmbience" aria-describedby="game-ambience-value">
            <output id="game-ambience-value" for="game-ambience-volume">100%</output>
          </label>
          <label class="volume-setting" for="game-sfx-volume">
            <span class="volume-setting-copy"><strong>游戏音效</strong><small>交互、检定与结局演出音效</small></span>
            <input id="game-sfx-volume" type="range" min="0" max="100" step="5" data-audio-setting="gameSfx" aria-describedby="game-sfx-value">
            <output id="game-sfx-value" for="game-sfx-volume">100%</output>
          </label>
          <label class="volume-setting" for="button-sfx-volume">
            <span class="volume-setting-copy"><strong>点击音效</strong><small>游戏内按钮与各页面的按钮、链接点击声</small></span>
            <input id="button-sfx-volume" type="range" min="0" max="100" step="5" data-audio-setting="buttonSfx" aria-describedby="button-sfx-value">
            <output id="button-sfx-value" for="button-sfx-volume">100%</output>
          </label>
        </div>
      </section>

      <section id="game-panel" class="settings-tab-panel" role="tabpanel" aria-labelledby="game-tab" hidden>
        <p class="page-introduction">游戏设置会立即保存到当前账号。</p>
        <label class="toggle-setting" for="auto-save-enabled">
          <span class="toggle-setting-copy"><strong>自动存档</strong><small>首次进入新车厢时，自动保存当前稳定进度到正在使用的存档槽位。</small></span>
          <input id="auto-save-enabled" type="checkbox" role="switch">
        </label>
        <section class="shortcut-settings" aria-labelledby="shortcut-settings-title">
          <div class="shortcut-settings-header">
            <div>
              <h2 id="shortcut-settings-title">快捷键</h2>
              <p>点击按键后直接按下一个键。每项只能绑定一个按键，不能重复。</p>
            </div>
            <button id="reset-shortcuts" type="button">恢复默认快捷键</button>
          </div>
          <div id="shortcut-setting-list" class="shortcut-setting-list"></div>
          <p id="shortcut-setting-message" class="shortcut-setting-message" role="status" aria-live="polite"></p>
        </section>
      </section>

      <section id="endings-panel" class="settings-tab-panel" role="tabpanel" aria-labelledby="endings-tab" hidden>
        <div class="ending-collection-header">
          <p class="page-introduction">到达结局后，对应记录会永久保存在当前账号中。</p>
          <strong id="ending-progress" aria-live="polite">已收集 0 / 6</strong>
        </div>
        <div id="ending-collection" class="ending-collection" aria-label="结局收藏"></div>
      </section>

      <section id="achievements-panel" class="settings-tab-panel achievement-section" role="tabpanel" aria-labelledby="achievements-tab" hidden>
        <div class="achievement-collection-header">
          <div>
            <h2 id="achievement-title">成就</h2>
            <p class="page-introduction">满足条件后，成就会永久保存在当前账号中。</p>
          </div>
          <strong id="achievement-progress" aria-live="polite">已解锁 0 / 9</strong>
        </div>
        <div id="achievement-collection" class="achievement-collection" aria-label="成就收藏"></div>
      </section>
      <nav class="page-footer"><a href="home.html">返回主页</a></nav>
    </section>
  </main>
  <script src="src/compat-loader.js" data-src="src/settings.js?v=achievement-20260921-1"></script>
  <!-- 初始化设置标签、音量滑杆、结局收藏与成就九宫格。 -->
</body>
</html>
