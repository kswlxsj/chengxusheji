<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>常暗之厢 · 游戏</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles/main.css?v=parking-ending-video-20260913-1">
  <link rel="stylesheet" href="styles/carriage-02-darkness.css?v=20260913-1">
  <script src="src/namespace.js"></script>
  <!-- window.TrainGame，以及 deepClone、delay 基础接口。 -->

  <script src="src/auth.js"></script>
  <!-- TrainGame.Auth，提供 register、login、currentUser、logout 等账号接口。 -->
   
  <script src="src/auth-guard.js"></script>
  <!-- 调用 TrainGame.Auth.requireAuth，并注册 pageshow 登录校验；不新增主要公开接口。 -->
</head>
<body>
  <main id="game-shell" aria-label="游戏区域">
    <section id="scene-layer" aria-label="当前场景"></section>

    <header id="hud" hidden>
      <div id="scene-name">载入中……</div>
      <div id="attributes"></div>
      <div id="save-slot"></div>
      <div class="hud-actions">
        <button id="pause-button" type="button">暂停</button>
      </div>
    </header>

    <aside id="inventory-bar" aria-label="物品栏" hidden>
      <div class="inventory-bar-title">物品栏</div>
      <div id="inventory-slots" aria-label="快捷物品格"></div>
    </aside>

    <div id="window-layer" aria-live="polite"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="acquisition-layer" aria-label="获得物品提示" aria-live="polite"></div>
  </main>

  <!-- CODEX ADD START -->
  <div id="codex-ending-overlay" hidden>
    <video
      id="codex-ending-video"
      src="assets/video/end.mp4"
      playsinline
      preload="auto"
      aria-label="结局视频"
    ></video>
    <div id="codex-ending-actions">
      <button id="codex-ending-skip" class="codex-ending-button" type="button">跳过</button>
      <button id="codex-ending-load" class="codex-ending-button" type="button" hidden>读取存档</button>
      <button id="codex-ending-home" class="codex-ending-button" type="button" hidden>返回主页</button>
    </div>
  </div>
  <!-- CODEX ADD END -->

  <!-- 编译产物放在最前面；其余脚本读取 window.GAME_DATA。 -->
  <script src="data/compiled-game-data.js?v=bottle-rule-20260914-2"></script>
  <!-- window.GAME_DATA，包含 meta、scenes、events、items、attributes、skills 等游戏数据。 -->
  
  <script src="src/page-flow.js"></script>
  <!-- TrainGame.PageFlow，提供路由跳转、存档槽位解析和跨页临时数据接口。 -->
  
  <script src="src/state.js?v=local-ui-flow-20260912-3"></script>
  <!-- TrainGame.GameState、TrainGame.SaveManager，提供游戏状态和存档管理接口。 -->
  
  <script src="src/ui.js?v=e011-audio-20260913-1"></script>
  <!-- TrainGame.GameWindow、TrainGame.TextPlayer、TrainGame.UIManager，提供窗口、文本和 UI 管理接口。 -->

  <script src="src/audio.js?v=parking-ending-20260913-1"></script>
  <!-- TrainGame.AudioManager，音效播放：编号来自 data/audio.json，sound 动作经 ui.audio 调用。 -->
  
  <script src="src/scene.js?v=carriage-motion-20260913-2"></script>
  <!-- TrainGame.evaluateCondition、TrainGame.SceneManager，提供条件判断和场景管理接口。 -->
  
  <script src="src/events.js?v=e011-audio-20260913-1"></script>
  <!-- TrainGame.Registry、TrainGame.EventEngine，提供动作注册和事件执行接口。 -->
  
  <script src="src/dice.js?v=dice-animation-20260912-1"></script>
  <!-- TrainGame.Dice，提供检定注册、查询和执行接口。 -->
  
  <script src="src/custom-actions.js"></script>
  <!-- TrainGame.registerProjectActions，用于向事件引擎注册项目自定义动作。 -->

  <script src="src/san-zero-sequence.js?v=san-zero-load-timeout-20260913-2"></script>
  <!-- SAN 归零后的记者采访与 PC 失控演出。 -->

  <script src="src/ending-a-sequence.js?v=ending-a-20260913-1"></script>
  <!-- 结局 A：终点站、站台与 MOVE FORWARD 的完整过场演出。 -->

  <script src="src/parking-ending-sequence.js?v=parking-ending-video-20260913-1"></script>
  <!-- 停车结局：减速停车、黑暗吞噬、血水与啃食声的完整过场演出。 -->
  
  <script src="src/minigames.js"></script>
  <!-- TrainGame.Minigames，小游戏注册表：JSON 的 minigame 动作只引用这里的编号。 -->

  <script src="src/minigame-games/webgl3d-demo.js"></script>
  <!-- 项目小游戏模块（src/minigame-games/*.js）：注册表条目，顶层只注册、运行期再碰 DOM。 -->

  <script src="src/minigame-games/card-battle.js?v=20260911-bg"></script>
  <!-- 战斗轮卡牌小游戏：四张牌单出/双出、敌人候选牌与濒死无限体力。 -->

    <script src="src/minigame-games/radio-tuning.js?v=scene-stability-20260913-1"></script>
  <!-- E-0008 收音机调频小游戏：追踪移动频段并稳定解码广播。 -->

  <script src="src/minigame-games/crew-negotiation.js"></script>
  <!-- 乘务员安抚与交涉小游戏模块（属于 src/minigame-games/*.js）：顶层只注册、运行期再碰 DOM。 -->

    <script src="src/minigame-games/conductor-tug.js?v=scene-stability-20260913-1"></script>
  <!-- 终局控制杆争夺小游戏：进入先头车厢后触发，抓握区大小读取里世界交钥匙历史。 -->

  <script src="src/train-bgm.js"></script>
  <!-- 正式游戏页循环播放列车背景音；进入里世界后由 main.js 暂停。 -->

  <script src="src/main.js?v=scene-and-dice-audio-20260914-1"></script>
  <!-- 创建并初始化当前页面的游戏实例，并新增 window.game 调试接口。 -->
</body>
</html>
