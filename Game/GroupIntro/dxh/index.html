- 我是 **BIT CS 2025 级学生**，喜欢研究技术和新事物。
- 想要的太多，啥都接触过一点。但是广而不精，眼高手低来着。

## 爱好

- 氛围特别的电子游戏！我最喜欢复古低分辨率和故障艺术类的风格。我希望有一天能做出了不起的互动媒体。喜欢的作品：
    - Yume Nikki
    - Who&#39;s Lila?
    - Disco Elysium
    - Rain World
    - Tyl3R5
- 绘画，视觉设计（主要是平面设计）和 AIGC。或许你会在社交媒体上碰巧看到过我发的插画。
- 编曲和音效设计——仅仅是在学习。*DAW 是真的很难用。*
- 喜欢听音乐。听的范围很杂，难以描述。我还挺喜欢电棍鬼叫音 mad，古风 DJ 和哈基米音乐的……
- 计算机技术和折腾高效工作流。一般我一天至少会看 12 个小时的电脑。**总是可以在线秒回！**

## 寻求伙伴

&gt; 如果你会这些，且有意与我合作……你就是我的老大！
- 如果你会熟练使用任何一种 DAW 或者乐器且喜欢氛围音乐……
- 如果你有特别有趣的新媒体想分享给我看……
- 如果你擅长写故事和小说……
- 如果你是 CS 大手子，精通各种前卫技术……
- 如果你擅长 3D 技术，比如建模和渲染……
- 如果你 energetic 又温和友善……

## 工具栈
- `C#,HLSL 和 Unity`:迟迟难产的游戏开发项目和 Unity 官方的抽象政策常常让我头疼。加我好友一起骂 Unity 公司。
- `Python`:最近在学习 Agent 开发。对强化学习的 agent 非常着迷。加我好友来玩我做的 qq 机器人。
- `Photoshop等Adobe软件`:插画，动画和其它视觉资产为主。和我增加好感度以解锁隐藏CG。
- `C/C++`:仅仅是有所涉猎，暂时还没遇到让我感兴趣的底层项目。
- `HTML/CSS/JS`:我们这次用来搭网页游戏的东西~</template>

## 值得一看的项目或许有:

### [ScratchEditor](https://github.com/leixin0725/ScratchEditor)
![](assets/1_1.png)
ScratchEditor 是一款面向 Windows 的轻量临时文本编辑器，适合快速整理剪贴板文本、 编写 Markdown，以及在 Codex、pi-coding-agent 等命令行工具中编辑较长的提示词。 它以速度和键盘操作为重点：窗口可常驻后台并通过全局快捷键即时唤出，也可以按文件 启动为一次性的外部编辑器。

### [Bai](https://github.com/leixin0725/Bai)
一个 Python 单用户聊天 Agent。它不创建或切换“对话”：每次启动都从同一份永久原始记录、近期直接上下文和长期记忆继续工作。
&gt; 曾依赖 astrbot ,后来决定独立出来开始造轮子的一个项目，仅仅是起步阶段。我只给它搭了个框架，一直没机会把它做得更有特色……

### [AHK_toolbox](https://github.com/leixin0725/AHK_toolbox)
一些自用的 AHK 脚本用来让我的屏幕时光舒服一点儿，或许也可以让你舒服点儿。</template>

我一直有开发游戏的想法，但是很少做出自己满意的觉得值得发出来的东西。

*不过这个看起来还不错。*

图中是我做的一个窗口系统框架（它以一个 Unity 6 uGUI package 的形式存在），它实现了很优雅的实例级工作区、引用图、布局、快照持久化和二维分层区域系统。它提供了好用的接口，或许我不久会把它挂出来开源。

最终展示为一个近似于 **多通道经过遮盖/合并等逻辑，最终划分出逻辑区域和屏幕显示区域** 的效果。</template>
