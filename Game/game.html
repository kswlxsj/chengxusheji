<body>
  <main id="game-shell" aria-label="游戏区域">
    <section id="scene-layer" aria-label="当前场景"></section>

    <header id="hud" hidden>

      <div id="inventory-slots" aria-label="快捷物品格"></div>
    </aside>

    <div id="window-layer" aria-live="polite"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="acquisition-layer" aria-label="获得物品提示" aria-live="polite"></div>
  </main>

  <!-- CODEX ADD START -->
  <div id="codex-ending-overlay" hidden>
    <video
      id="codex-ending-video"
      src="assets/video/end.mp4"
      playsinline
      preload="auto"
      aria-label="结局视频"
    ></video>
    <div id="codex-ending-actions">
      <button id="codex-ending-skip" class="codex-ending-button" type="button">跳过</button>
      <button id="codex-ending-restart" class="codex-ending-button codex-ending-restart" type="button" hidden>重新开始</button>
    </div>
  </div>
