<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>常暗之厢 · 收音机调频 UI 预览</title>
  <style>
    @font-face {
      font-family: "Ark Pixel 12px";
      src: url("assets/Fonts/ark-pixel-12px-monospaced-zh-cn.woff2") format("woff2");
      font-display: swap;
      font-weight: normal;
      font-style: normal;
    }

    * { box-sizing: border-box; }
    html,
    body {
      width: 100%;
      min-width: 320px;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080a0d;
    }
    #preview-stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(rgba(0, 0, 0, .70), rgba(0, 0, 0, .70)), url("assets/Image/Scene/Background/carriage-07.png") center / cover;
    }
    #preview-stage .radio-tuning { background: transparent; }
    #preview-stage .radio-tuning .rt-shell {
      background: transparent;
      border-color: transparent;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <main id="preview-stage" aria-label="收音机调频小游戏预览"></main>

  <script src="src/namespace.js"></script>
  <script src="src/minigames.js"></script>
  <script src="src/minigame-games/radio-tuning.js?v=radio-responsive-20260915-2"></script>
  <script>
    "use strict";

    const stage = document.querySelector("#preview-stage");
    let cleanup = null;
    let quit = null;

    const context = {
      stage,
      wait(milliseconds) {
        return new Promise((resolve) => window.setTimeout(resolve, milliseconds));
      },
      onQuit(handler) {
        quit = handler;
      },
      registerCleanup(handler) {
        cleanup = handler;
      }
    };

    window.TrainGame.Minigames.get("radio_tuning").run(context).catch((error) => {
      console.error("收音机调频预览运行失败：", error);
    });

    window.addEventListener("beforeunload", () => {
      quit?.();
      cleanup?.();
    });
  </script>
</body>
</html>
